[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-mqtt-contract-testkit"
version = "0.1.0"
description = "Generic Home Assistant MQTT contract-test support"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt==2.1.0",
    "requests==2.34.2",
    "websocket-client==1.9.2",
]

[tool.setuptools.packages.find]
where = ["src"]
